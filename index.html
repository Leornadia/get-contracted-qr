<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Contracted</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5d6678;
        --line: #d8dde6;
        --paper: #ffffff;
        --wash: #f3f6fb;
        --accent: #0f6b5f;
        --accent-dark: #0a4f46;
        --gold: #c7922e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--wash);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding: 0 0 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4.6vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .prompt {
        margin: 0;
        max-width: 430px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.45;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        padding-top: 24px;
      }

      .step-card {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        text-decoration: none;
        color: inherit;
        box-shadow: 0 14px 30px rgba(23, 32, 51, 0.08);
      }

      .step-card:focus-visible {
        outline: 4px solid rgba(15, 107, 95, 0.28);
        outline-offset: 4px;
      }

      .thumb {
        display: grid;
        place-items: center;
        aspect-ratio: 16 / 10;
        background: #eef2f7;
        border-bottom: 1px solid var(--line);
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .content {
        padding: 22px;
      }

      .step-label {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(199, 146, 46, 0.45);
        border-radius: 999px;
        color: #7a5313;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h2 {
        margin: 16px 0 8px;
        font-size: clamp(1.45rem, 3vw, 2.15rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      .description {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 22px 22px;
        padding: 15px 16px;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 700;
      }

      .step-card:hover .action {
        background: var(--accent-dark);
      }

      .arrow {
        flex: 0 0 auto;
        font-size: 1.35rem;
        line-height: 1;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 560px);
          padding: 22px 0;
        }

        .header {
          display: block;
        }

        .prompt {
          margin-top: 12px;
        }

        .steps {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .content {
          padding: 18px;
        }

        .action {
          margin: 0 18px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <p class="eyebrow">Allen &amp; Associates</p>
          <h1>Get Contracted</h1>
        </div>
        <p class="prompt">Select the step you need to continue.</p>
      </header>

      <section class="steps" aria-label="Contracting steps">
        <a class="step-card" href="https://youtu.be/yIVkulGVhHE?si=ZDG-nIgpf-Mv6Aod">
          <div class="thumb">
            <img src="STEP%20%231.png" alt="Step 1 thumbnail" />
          </div>
          <div class="content">
            <span class="step-label">Step 1</span>
            <h2>Watch the setup video</h2>
            <p class="description">Open the Step 1 walkthrough before starting your contracting profile.</p>
          </div>
          <div class="action">
            <span>Open Step 1</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </div>
        </a>

        <a class="step-card" href="https://accounts.surancebay.com/oauth/authorize?redirect_uri=https:%2F%2Fsurelc.surancebay.com%2Fproducer%2Foauth%3FreturnUrl%3D%252Fprofile%252Fcontact-info%253FgaId%253D509%2526gaId%253D509%2526branch%253DAllen%252520%252526%252520Associates%2526branchVisible%253Dtrue%2526branchEditable%253Dtrue%2526branchRequired%253Dtrue%2526dba%253DP%2526autoAdd%253Dfalse%2526requestMethod%253DGET&amp;gaId=509&amp;client_id=surecrmweb&amp;response_type=code">
          <div class="thumb">
            <img src="STEP%20%232.png" alt="Step 2 thumbnail" />
          </div>
          <div class="content">
            <span class="step-label">Step 2</span>
            <h2>Start your SureLC profile</h2>
            <p class="description">Open the contracting form for Allen &amp; Associates.</p>
          </div>
          <div class="action">
            <span>Open Step 2</span>
            <span class="arrow" aria-hidden="true">-&gt;</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
